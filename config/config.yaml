data_sources:
  adventurelookup:
    base_url: "https://www.adventurelookup.com/api"
    seed: 42
  5etools:
    base_url: "https://raw.githubusercontent.com/5etools-mirror-3/5etools-src/refs/heads/main/data"
    description_types:
      - "section"
      - "entries"
      - "inset"
      - "insetReadaloud"
      - "quote"

inference:
  llm:
    base_url: "http://localhost:11434/v1"
    model: "qwen3:8b"
    temperature: 0
    max_tokens: 256
    max_workers: 8
    json_mode: true
    timeout: 120
    extra_params:      
      chat_template_kwargs:
        enable_thinking: false
      reasoning_effort: "none"
  tfidf:
    fallback_threshold: 0.4
    max_iter: 1000
    max_features: 50000
