[project]
name = "indexer"
readme = "README.md"
authors = [
    { name = "aaqil-a", email = "muhammadaaqila@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
    "tqdm>=4.70.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.2",
    "numpy>=1.26.0",
]

[project.scripts]
ingest = "indexer:ingest_cli"
infer = "indexer:infer_cli"
index = "indexer:index_cli"
tfidf = "indexer:tfidf_cli"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
